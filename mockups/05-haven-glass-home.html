<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>05 Haven Glass Home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 20% 30%,#12203a 0%,#080c16 50%,#0c1020 100%);color:#f0f8ff;min-height:100vh}
nav{margin:1rem 1.5rem;padding:1rem 1.5rem;background:rgba(18,24,40,.85);border:1px solid #3c5078;border-radius:16px;display:flex;align-items:center;gap:1rem;backdrop-filter:blur(12px)}
.logo{color:#22d3ee;font-weight:600;font-size:1.2rem}.logo span{color:#a78bfa;font-weight:400;font-size:.9rem;margin-left:.4rem}
nav .links{margin-left:auto;display:flex;gap:1.5rem}nav a{color:#b4c8dc;text-decoration:none;font-size:.9rem}
main{padding:1.5rem 2rem}h1{font-size:1.85rem;font-weight:600;margin-bottom:.4rem}.sub{color:#8ca0be;margin-bottom:1.75rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.card{background:rgba(16,22,38,.9);border:1px solid #324670;border-radius:18px;padding:1.25rem;position:relative;overflow:hidden}
.card:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#22d3ee}
.card:nth-child(even):before{background:#a78bfa}
.cat{color:#22d3ee;font-size:.7rem;font-weight:700;letter-spacing:.08em;margin-bottom:.5rem}
.card h2{font-size:1.35rem;margin-bottom:.5rem}.card p{color:#96aac2;font-size:.9rem;min-height:2.6em}
.meta{margin:1rem 0;display:flex;gap:1rem}.meta .v{color:#a78bfa}.meta .s{color:#7890a5;font-size:.85rem}
.actions{display:flex;gap:.6rem}
.btn{padding:.65rem 1.1rem;border-radius:10px;font-weight:700;border:0;cursor:pointer;font-size:.9rem}
.btn.p{background:#22d3ee;color:#080c16}.btn.s{background:transparent;color:#a78bfa;border:1px solid #a78bfa}
</style></head><body>
<nav><div class="logo">kilrkrow <span>haven</span></div>
<div class="links"><a href="#">Catalog</a><a href="#">Labs</a><a href="#">Releases</a></div></nav>
<main>
<h1>Glass shelf for Windows tools</h1>
<p class="sub">Cyan / violet accents · dark glass panels · same honest release links</p>
<div class="grid" id="g"></div>
</main>
<script>
const PRODUCTS = [
  {name:"Audio Mixer", pitch:"Quick volume control for Windows", ver:"v0.1.1", cat:"Utilities", asset:"AudioMixer-win-x64-v0.1.1.zip", size:"70.8 MB", slug:"audio-mixer"},
  {name:"Sideclip", pitch:"Tray clipboard beside Win+V with secret TTL", ver:"v0.1.0", cat:"Clipboard", asset:"Sideclip-win-x64-v0.1.0.zip", size:"66.7 MB", slug:"sideclip"},
  {name:"VoltDesk", pitch:"Desk power & USB hub status at a glance", ver:"v0.2.3", cat:"Hardware", asset:"VoltDesk-win-x64-v0.2.3.zip", size:"41.2 MB", slug:"voltdesk"},
  {name:"NetPulse", pitch:"Ping, traceroute, and domain dossier", ver:"v0.1.0", cat:"Network", asset:"NetPulse-win-x64-v0.1.0.zip", size:"64.2 MB", slug:"netpulse"},
  {name:"Win Service Buddy", pitch:"Manage product-scoped Windows services", ver:"v0.2.0", cat:"Admin", asset:"wsbuddy-app-win-x64-v0.2.0.zip", size:"42.3 MB", slug:"win-service-buddy"},
];

const g=document.getElementById('g');
PRODUCTS.forEach(p=>{g.innerHTML+=`<article class="card"><div class="cat">${p.cat.toUpperCase()}</div><h2>${p.name}</h2><p>${p.pitch}</p>
<div class="meta"><span class="v">${p.ver}</span><span class="s">${p.size}</span></div>
<div class="actions"><button class="btn p">Download</button><button class="btn s">Details</button></div></article>`});
</script></body></html>
